; T232-DST: the Tester232 RS232/TTL inspector on the FNIRSI DST-210, an
; Artery AT32F403A treated as an STM32F103VE.
;
; flash_t232 builds the tester for the unit's flash, linked after the FNIRSI
; application (0x0806B000). It is never uploaded from here: the unit's flash
; is read-protected. tools/make_update.py puts it together with the FNIRSI
; application into a file for the FNIRSI USB update (README).
;
; The platform and the library are pinned to the versions the firmware was
; built and tested with.

[platformio]
default_envs = flash_t232
; test builds that run from RAM over SWD; kept apart, not published
extra_configs = tools/*.ini

[env]
platform = ststm32@19.0.0
board = genericSTM32F103VE
board_build.mcu = stm32f103vet6
framework = arduino
debug_tool = stlink

; The core's USB serial (CDC), with the settings T232USB used on the DSO-152
; (its UsbFix.cpp takes the packets in the interrupt). The USB clock comes
; from the internal 48 MHz oscillator, as in the FNIRSI firmware (Probe.cpp).
[usb]
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC -D USBCON -D USBD_CDC_USE_SINGLE_BUFFER
              -D USB_CDC_TRANSMIT_TIMEOUT=500 -D USB_RX_SIZE=512

; The tester for flash, after the FNIRSI application: linked at 0x0806B000
; and entered through src/boot/BootStub.S when RUN is held at power-on.
; Never uploaded from here (the flash is read-protected; an upload would at
; best fail): tools/make_update.py puts it together with the FNIRSI app.bin
; into a file for the FNIRSI USB update.
[env:flash_t232]
; -u t232_boot: nothing calls the way in (the FNIRSI start-up jumps to it),
; and without this the linker drops it.
build_flags = -I src/hw -I src/app -D HAL_TIM_MODULE_ONLY -Wl,-u,t232_boot ${usb.build_flags}
build_src_filter = +<app/> +<hw/Lcd.cpp> +<hw/Probe.cpp> +<boot/>
lib_deps = adafruit/Adafruit GFX Library@1.12.6
board_build.flash_offset = 0x6B000
board_upload.offset_address = 0x0806B000
; to 0x08080000, the end of a 512 kB part (the DST-210 seen so far has 1 MB)
board_upload.maximum_size = 524288
upload_protocol = custom
upload_command = echo "flash_t232 is not uploaded: see tools/make_update.py" && exit 1
